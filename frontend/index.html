<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SENTINEL | Sensor Intelligence</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            padding: 30px;
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 32px;
        }

        header p {
            color: #94a3b8;
            margin-top: 8px;
        }

        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 15px;
            border-radius: 20px;
            background: #14532d;
            color: #86efac;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #334155;
        }

        .card h3 {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
        }

        .table-container {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #334155;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            color: #94a3b8;
        }

        .high {
            color: #4ade80;
        }

        .medium {
            color: #facc15;
        }

        .low {
            color: #f87171;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🛡️ SENTINEL</h1>
        <p>Environmental Sensor Intelligence & Reliability Platform</p>

        <div class="status">
            ● SYSTEM ONLINE
        </div>
    </header>

    <section class="cards">

        <div class="card">
            <h3>Total Records</h3>
            <div class="value" id="records">Loading...</div>
        </div>

        <div class="card">
            <h3>Monitoring Stations</h3>
            <div class="value" id="stations">Loading...</div>
        </div>

        <div class="card">
            <h3>Sensor Channels</h3>
            <div class="value" id="sensors">Loading...</div>
        </div>

    </section>

    <section class="table-container">

        <h2>Recent Sensor Readings</h2>

        <table>
            <thead>
                <tr>
                    <th>Station</th>
                    <th>Timestamp</th>
                    <th>CO</th>
                    <th>NOx</th>
                    <th>NO2</th>
                </tr>
            </thead>

            <tbody id="readings">
                <tr>
                    <td colspan="5">Loading sensor data...</td>
                </tr>
            </tbody>

        </table>

    </section>


    <script>

        const API = "PASTE_THE_5001_FORWARD_ADDRESS_HERE";

        // Load summary
        fetch(`${API}/api/summary`)
            .then(response => response.json())
            .then(data => {

                document.getElementById("records").textContent =
                    data.total_records;

                document.getElementById("stations").textContent =
                    data.stations;

                document.getElementById("sensors").textContent =
                    data.sensors;

            })
            .catch(error => {
                console.error("API Error:", error);
            });


        // Load readings
        fetch(`${API}/api/readings`)
            .then(response => response.json())
            .then(data => {

                const table = document.getElementById("readings");

                table.innerHTML = "";

                data.forEach(row => {

                    const tr = document.createElement("tr");

                    tr.innerHTML = `
                        <td>${row.Station_ID}</td>
                        <td>${row.Timestamp}</td>
                        <td>${row.CO_Channel}</td>
                        <td>${row.NOx_Channel}</td>
                        <td>${row.NO2_Channel}</td>
                    `;

                    table.appendChild(tr);

                });

            })
            .catch(error => {

                document.getElementById("readings").innerHTML =
                    "<tr><td colspan='5'>Unable to connect to API</td></tr>";

                console.error("API Error:", error);

            });

    </script>

</body>
</html>
